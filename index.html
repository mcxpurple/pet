<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Q版桌寵</title>
<link rel="stylesheet" href="vh-ui.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="pet-engine.js"></script>
<script src="pet-picker.js"></script>
<style>
  :root { --bg-img: url("../rp/bg/night-h.webp"); --bg-fade: rgba(23,19,29,.62); }
  @media (prefers-color-scheme: light) { :root { --bg-img: url("../rp/bg/day-h.webp"); --bg-fade: rgba(238,235,242,.55); } }
  @media (max-aspect-ratio: 1/1) {
    :root { --bg-img: url("../rp/bg/night-v.webp"); }
    @media (prefers-color-scheme: light) { :root { --bg-img: url("../rp/bg/day-v.webp"); } }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { background: linear-gradient(var(--bg-fade), var(--bg-fade)), var(--bg-img) center / cover no-repeat, var(--bg);
    user-select: none; -webkit-user-select: none; touch-action: none; }
  header { position: relative; z-index: 20; display: flex; align-items: center; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(6px); }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .06em; }
  header h1 small { display: block; font-size: 11.5px; font-weight: 400; letter-spacing: 0; color: var(--muted); margin-top: 1px; }
  header .tape { top: 50%; right: 16px; transform: translateY(-50%) rotate(4deg); }
  #stage { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #picker { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 72px 16px 24px;
    background: color-mix(in srgb, var(--bg) 35%, transparent); }
  #picker .sheet { width: min(520px, 100%); max-height: 100%; overflow-y: auto; }
  .install { display: block; text-align: center; margin-top: 14px; font-size: 12.5px; color: var(--accent); }
  #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 14px; z-index: 40; }
</style>
</head>
<body class="vh">
<header>
  <h1>Violet Hour 紫夜星光<small>Q版桌寵</small></h1>
  <button id="switch" class="tape" hidden>換角色</button>
</header>
<div id="stage"></div>

<div id="picker" hidden>
  <div class="sheet">
    <div class="fd-head">
      <div class="fd-tabs"><span class="on">選擇角色</span></div>
      <div class="fd-body">
        <h2>選擇桌寵</h2>
        <p>先選作品，再點照片選取，最多兩隻。</p>
        <div class="vsel"><select id="group" aria-label="作品"></select></div>
      </div>
    </div>
    <section class="scard"><div class="in"><div class="pols" id="grid"></div></div></section>
    <div class="picked" id="picked"></div>
    <div class="fd-body size-box"><div class="size"><span class="lb">角色大小</span><div class="seg" id="size" role="group" aria-label="角色大小"></div></div></div>
    <button class="tk" id="go" type="button">
      <span class="f"><span class="orn">✦</span><span class="t">開始散步</span><span class="en">let's walk</span><span class="orn">✦</span></span>
      <span class="s">🐾</span>
    </button>
    <a class="install" href="install.html">想讓角色在每個網頁上走？安裝 Chrome 版 ›</a>
  </div>
</div>
<div id="loading">載入中…</div>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('pet_pick')) || []; } catch { return []; } },
    set(v) { try { localStorage.setItem('pet_pick', JSON.stringify(v)); } catch {} }
  };
  const exists = url => fetch(url, { method: 'HEAD', cache: 'no-cache' }).then(r => r.ok).catch(() => false);
  const bitmap = url => fetch(url).then(r => r.blob()).then(b => createImageBitmap(b));

  let roster;
  try {
    const raw = jsyaml.load(await (await fetch('roster.yaml', { cache: 'no-cache' })).text()) || [];
    roster = (await Promise.all(raw.map(async r => {
      const c = QPet.normalize(r); c.sets = {};
      await Promise.all(c.states.map(async s => {
        const urls = QPet.variantNames(s).map(n => `pets/${c.id}/${n}.png`);
        const ok = await Promise.all(urls.map(exists));
        c.sets[s] = urls.filter((_, i) => ok[i]);
      }));
      c.thumb = c.sets.idle[0];
      return c.sets.idle.length ? c : null;
    }))).filter(Boolean);
  } catch (e) { $('loading').textContent = '角色名冊讀取失敗'; console.error(e); return; }
  $('loading').remove();

  const world = new QPet.World($('stage'));
  let size = '中';
  try { size = localStorage.getItem('pet_size') || '中'; } catch {}
  world.setSize(size);
  QPet.sizeSeg($('size'), world.size, s => { world.setSize(s); try { localStorage.setItem('pet_size', s); } catch {} });
  let current = store.get().filter(id => roster.some(c => c.id === id));
  let ui;

  function openPicker() {
    ui = QPet.picker({ select: $('group'), grid: $('grid'), picked: $('picked'), roster, pick: current,
      onChange: p => { $('go').disabled = !p.length; } });
    $('go').disabled = !ui.pick.length;
    $('picker').hidden = false; $('switch').hidden = true;
  }
  async function start(ids) {
    current = ids; store.set(ids);
    $('picker').hidden = true; $('switch').hidden = false;
    const chosen = ids.map(id => roster.find(c => c.id === id)).filter(Boolean);
    const list = await Promise.all(chosen.map(async c => {
      const bitmaps = {};
      await Promise.all(Object.entries(c.sets).map(async ([s, urls]) => {
        bitmaps[s] = (await Promise.all(urls.map(u => bitmap(u).catch(() => null)))).filter(Boolean);
      }));
      return { cfg: c, bitmaps };
    }));
    world.set(list);
  }
  $('go').onclick = () => { if (ui.pick.length) start(ui.pick); };
  $('switch').onclick = openPicker;

  if (!roster.length) { document.body.insertAdjacentHTML('beforeend', '<div id="loading">名冊中沒有可用角色</div>'); return; }
  if (current.length) start(current); else openPicker();
})();
</script>
</body>
</html>
