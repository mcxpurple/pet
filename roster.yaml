# 未填欄位套用預設值：size 120｜speed 中｜sleep_after 60｜effect_click 愛心｜effect_sleep zzz｜extras 無｜walk_fx 無｜BD 無｜BD_fx 無
# effect_click 可填 愛心｜音符｜驚嘆號｜無，或 emoji 陣列（每次隨機一個）
